# Checks every pull request and every push to main, and publishes each
# release to npm.
#
# `check` is `pnpm check`: biome, the typecheck, the tests and the build,
# so a branch that passes it on a laptop passes it here.
#
# `publish` puts each release on npm once it reaches main, after `check`. A
# release is the push that changes the version in package.json (README.md,
# "Releases"), so it publishes only a version npm doesn't have yet, with
# provenance, which links the published package to this run. It signs in
# to npm with trusted publishing (OIDC): npm trusts this repository's
# `ci.yml` to publish @superforge/infra, set on the package's settings page
# on npmjs.com, so no token is kept anywhere. An NPM_TOKEN secret, if one
# is ever set, is used in its place.
#
# `release-version`, on a PR, checks that the PR is a release: its version
# in package.json is the one right after its base's, a patch, a minor or a
# major, with its line at the top of CHANGELOG.md. Two PRs made side by side
# can't both go out as one version: after the second's rebase this checks
# it took the version after the first's. Dependabot's PRs skip it; their
# changes go out with the next release.
#
# Every action is pinned by its commit, the tag it was beside, since a tag
# can be moved and `publish` holds the right to publish.
name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check

    release-version:
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The base branch too, for the version it's on
                  fetch-depth: 0
            - name: The version after the base's, with its line
              run: |
                  base=$(git show "origin/$BASE:package.json" | jq -r .version)
                  version=$(jq -r .version package.json)
                  IFS=. read -r major minor patch <<< "$base"
                  next_patch="$major.$minor.$((patch + 1))"
                  next_minor="$major.$((minor + 1)).0"
                  next_major="$((major + 1)).0.0"
                  case "$version" in
                      "$next_patch" | "$next_minor" | "$next_major") ;;
                      *)
                          echo "::error::package.json says $version, but $BASE is on $base, so this PR's release is $next_patch (a fix), $next_minor (something new an app can use) or $next_major (a change an app must make code changes for). Every PR is a release (README.md, \"Releases\"): if $BASE has moved, rebase on it and take the version after its."
                          exit 1
                          ;;
                  esac
                  first=$(grep -m 1 -E '^- [0-9]+\.[0-9]+\.[0-9]+ ' CHANGELOG.md || true)
                  case "$first" in
                      "- $version ("*) ;;
                      *)
                          echo "::error::CHANGELOG.md's first release line isn't $version's (\"- $version (day): …\")."
                          exit 1
                          ;;
                  esac
                  echo "This PR is $version, the release after $BASE's $base"
              env:
                  BASE: ${{ github.base_ref }}

    publish:
        if: ${{ github.event_name == 'push' }}
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            # For trusted publishing, and npm's provenance, which proves
            # this run built it
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  # Node 24's npm is 11, which trusted publishing needs
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - name: A version npm doesn't have yet
              id: release
              run: |
                  version=$(jq -r .version package.json)
                  if npm view "@superforge/infra@$version" version > /dev/null 2>&1; then
                      echo "$version is on npm already"
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                  fi
            - if: ${{ steps.release.outputs.publish == 'true' }}
              run: pnpm install --frozen-lockfile
            - if: ${{ steps.release.outputs.publish == 'true' }}
              run: pnpm build && npm publish --provenance --access public
              env:
                  # Empty once trusted publishing is set up, when npm signs
                  # in with this run's OIDC token instead
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
